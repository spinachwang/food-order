# food-order · Nginx site config
# 放到 /etc/nginx/sites-available/food-order.conf 后软链到 sites-enabled/
#
# 假定:
#   - 域名: app.example.com (前端 SPA) + api.example.com (后端 API)
#   - 后端监听: 127.0.0.1:8000 (uvicorn · systemd)
#   - 前端产物: /var/www/food-order/dist/
#   - HTTPS 证书由 certbot --nginx 注入 (本文件留 HTTP fallback)
#
# certbot 会把本文件改造成:
#   - 顶层加 listen 443 ssl + ssl_certificate 系列
#   - 顶层加 HTTP→HTTPS 重定向 server block
# 你无需手动加 ssl 字段。

# ----------------------------------------------------------------------------
# 后端 API (api.example.com)
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # certbot ACME 校验目录
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # 安全头（API 也加，避免泄漏后端信息）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # FastAPI 文档
    location /docs {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /redoc {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /openapi.json {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 主 API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 10M;
    }

    # /healthz 直接走，不走反代（减少日志噪音）
    location = /healthz {
        proxy_pass http://127.0.0.1:8000/healthz;
        access_log off;
    }

    # 其它路径 404，避免泄漏后端
    location / {
        return 404;
    }
}

# ----------------------------------------------------------------------------
# 前端 SPA (app.example.com)
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    # certbot ACME 校验
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/food-order/dist;
    index index.html;

    # 静态资源缓存（带 hash 的 assets 长期缓存）
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|svg|gif|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA 路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 不缓存 index.html（部署后用户立即拿到新版本）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
}
